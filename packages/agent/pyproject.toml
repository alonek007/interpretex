[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "interpretex-agent"
version = "1.0.0"
description = "Interpretex Part 2 — the Investigator Core: triage, hypothesis engine, planner, evidence ledger, deterministic policy gate, dossier."
requires-python = ">=3.11"
dependencies = [
    "interpretex-contracts",
    "pydantic>=2.6",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["agent*"]
