[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "interpretex-world"
version = "1.0.0"
description = "Interpretex Part 1: synthetic reference world, case generator, documents, extraction, investigation tools, network intelligence, attacker"
requires-python = ">=3.11"
dependencies = [
    "interpretex-contracts==1.0.0",
    "pydantic>=2.6",
]

[tool.setuptools.packages.find]
include = ["interpretex_world*"]
